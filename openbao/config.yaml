---
arch:
  - aarch64
  - amd64
description: >-
  Identity-based secrets and encryption management system (open source Vault
  fork). Single-node integrated Raft storage with web UI and API on port 8200.
homeassistant: 2024.1.0
icon: icon.png
image: ghcr.io/rezusnet/openbao-{arch}
init: true
name: OpenBao
panel_icon: mdi:vault
options:
  log_level: info
  auto_unseal: true
  audit_stdout: true
  audit_file: false
  trusted_proxies: ""
  env_vars: []
ports:
  8200/tcp: 8200
ports_description:
  8200/tcp: OpenBao API and UI
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  auto_unseal: bool
  audit_stdout: bool
  audit_file: bool
  trusted_proxies: str?
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
slug: openbao
startup: system
boot: auto
url: https://openbao.org
version: "2.6.2"
webui: 'http://[HOST]:[PORT:8200]/'
